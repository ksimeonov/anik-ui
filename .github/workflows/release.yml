name: Release

on:
  push:
    branches: [main]
  # Recovery path for a release that was tagged but never reached npm (D-050).
  # Run it on `main` with the tag to publish, e.g. v0.1.0.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The environment is restricted to `main` and is the only holder of the deploy
    # key that may bypass the `main` ruleset (D-045).
    environment: release
    permissions:
      contents: write # GitHub release + tags
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing (OIDC) + provenance
    env:
      HUSKY: 0 # the release commit must not run the local lint/commitlint hooks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Pack
        run: npm pack --dry-run
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
      # Brings the release commit (version + CHANGELOG) back to dev, so dev stays a
      # descendant of main. A no-op when dev already contains main. If it conflicts,
      # the release itself has already shipped — merge main into dev by hand.
      - name: Merge main back into dev
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@martynus.net"
          # semantic-release pushes by URL, so origin/main is stale until refetched.
          git fetch origin main dev
          git switch -c dev origin/dev
          git merge --no-ff --no-edit -m "chore(release): merge main back into dev" origin/main
          git push origin dev

  # Publishes an existing tag that semantic-release tagged but failed to publish.
  # semantic-release will not retry on its own: it sees the tag and finds nothing
  # to release. Same environment and workflow file as the release job, so npm
  # trusted publishing and provenance apply unchanged (D-050).
  publish-tag:
    name: publish-tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    env:
      HUSKY: 0
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Check the tag is released from main and not yet on npm
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not in main's history"; exit 1; }
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$TAG" ] \
            || { echo "::error::package.json says $version, tag says $TAG"; exit 1; }
          if npm view "anik-ui@$version" version >/dev/null 2>&1; then
            echo "::error::anik-ui@$version is already on npm"; exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require an npm that supports trusted publishing (>= 11.5.1)
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm -v)" \
            || { echo "::error::npm $(npm -v) is older than 11.5.1"; exit 1; }
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Publish
        run: npm publish --provenance

  # The live playground linked from the README (spec 11). Runs only after the release
  # job succeeds, so the site always matches what main has shipped.
  pages:
    name: pages
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write # publish the Pages deployment
      id-token: write # verify the deployment's origin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run build
      - run: npm run build:site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
