name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # The environment is restricted to `main` and is the only holder of the deploy
    # key that may bypass the `main` ruleset (D-045).
    environment: release
    permissions:
      contents: write # GitHub release + tags
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing (OIDC) + provenance
    env:
      HUSKY: 0 # the release commit must not run the local lint/commitlint hooks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Pack
        run: npm pack --dry-run
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
      # Brings the release commit (version + CHANGELOG) back to dev, so dev stays a
      # descendant of main. A no-op when dev already contains main. If it conflicts,
      # the release itself has already shipped — merge main into dev by hand.
      - name: Merge main back into dev
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@martynus.net"
          # semantic-release pushes by URL, so origin/main is stale until refetched.
          git fetch origin main dev
          git switch -c dev origin/dev
          git merge --no-ff --no-edit -m "chore(release): merge main back into dev" origin/main
          git push origin dev

  # The live playground linked from the README (spec 11). Runs only after the release
  # job succeeds, so the site always matches what main has shipped.
  pages:
    name: pages
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write # publish the Pages deployment
      id-token: write # verify the deployment's origin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run build
      - run: npm run build:site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
